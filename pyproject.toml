[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kyourai"
version = "0.1.0"
description = "Kyourai (記憶雷) — memory-first AI agent with team-native shared context and portable MCP memory."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Kyourai Contributors" }]
keywords = ["ai", "agent", "memory", "mcp", "self-hosted", "team"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pydantic-ai>=2.0.0",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0", "fastmcp>=3.0"]
local = ["ollama>=0.3"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.13",
]

[project.scripts]
kyourai = "kyourai.cli:main"

[project.urls]
Homepage = "https://github.com/kyourai/kyourai"
Repository = "https://github.com/kyourai/kyourai"

[tool.hatch.build.targets.wheel]
packages = ["kyourai"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
