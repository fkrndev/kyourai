<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kyourai Dashboard</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --red: #f85149;
    --yellow: #d29922;
    --purple: #bc8cff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  .header {
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .header h1 { font-size: 20px; font-weight: 600; }
  .header .logo { font-size: 24px; }
  .header .status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-dim);
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
  }
  .status-dot.offline { background: var(--red); }
  .tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
  }
  .tab {
    padding: 12px 20px;
    cursor: pointer;
    color: var(--text-dim);
    border-bottom: 2px solid transparent;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.2s;
  }
  .tab:hover { color: var(--text); }
  .tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .content { padding: 24px; max-width: 1200px; margin: 0 auto; }
  .panel { display: none; }
  .panel.active { display: block; }

  /* Cards */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
  }
  .card .label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
  .card .value { font-size: 28px; font-weight: 600; margin-top: 4px; }
  .card .value.green { color: var(--green); }
  .card .value.blue { color: var(--accent); }
  .card .value.purple { color: var(--purple); }

  /* Tables */
  table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 24px;
  }
  th, td {
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  th {
    color: var(--text-dim);
    font-weight: 500;
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.5px;
  }
  tr:hover { background: var(--surface); }

  /* Chat */
  .chat-container {
    display: flex;
    flex-direction: column;
    height: calc(100vh - 200px);
  }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 12px;
  }
  .msg {
    margin-bottom: 16px;
    max-width: 80%;
  }
  .msg.user { margin-left: auto; }
  .msg .role {
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 4px;
    text-transform: uppercase;
  }
  .msg .bubble {
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user .bubble {
    background: var(--accent);
    color: #fff;
  }
  .msg.assistant .bubble {
    background: var(--surface);
    border: 1px solid var(--border);
  }
  .chat-input {
    display: flex;
    gap: 8px;
  }
  .chat-input input {
    flex: 1;
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
  }
  .chat-input input:focus { outline: none; border-color: var(--accent); }
  .chat-input button {
    padding: 12px 24px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
  }
  .chat-input button:hover { opacity: 0.9; }
  .chat-input button:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Activity chart */
  .activity-bar {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 60px;
    margin-top: 8px;
  }
  .activity-bar .bar {
    flex: 1;
    background: var(--accent);
    border-radius: 2px 2px 0 0;
    min-height: 2px;
    transition: height 0.3s;
  }
  .activity-labels {
    display: flex;
    gap: 2px;
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 4px;
  }
  .activity-labels span { flex: 1; text-align: center; }

  /* Search */
  .search-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .search-bar input {
    flex: 1;
    padding: 10px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
  }
  .search-bar input:focus { outline: none; border-color: var(--accent); }
  .search-bar button {
    padding: 10px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    cursor: pointer;
    font-size: 14px;
  }
  .search-bar button:hover { border-color: var(--accent); }

  .snippet {
    color: var(--text-dim);
    font-size: 13px;
    margin-top: 4px;
  }
  .snippet mark { background: var(--yellow); color: var(--bg); padding: 0 2px; border-radius: 2px; }

  .empty { color: var(--text-dim); text-align: center; padding: 40px; }
  .loading { color: var(--text-dim); text-align: center; padding: 20px; }

  /* Config bar */
  .config-bar {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 16px;
    font-size: 13px;
  }
  .config-bar input {
    padding: 6px 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 13px;
    width: 200px;
  }
  .config-bar label { color: var(--text-dim); }
</style>
</head>
<body>

<div class="header">
  <span class="logo">⚡</span>
  <h1>Kyourai Dashboard</h1>
  <div class="status">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">Connecting...</span>
  </div>
</div>

<div class="tabs">
  <div class="tab active" data-tab="insights">Insights</div>
  <div class="tab" data-tab="sessions">Sessions</div>
  <div class="tab" data-tab="search">Search</div>
  <div class="tab" data-tab="chat">Chat</div>
</div>

<div class="content">

  <!-- Insights Panel -->
  <div class="panel active" id="panel-insights">
    <div class="config-bar">
      <label>Days:</label>
      <input type="number" id="insightsDays" value="30" min="1" max="365">
      <button onclick="loadInsights()" style="padding:6px 16px;background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text);cursor:pointer;">Refresh</button>
    </div>
    <div id="insightsContent">
      <div class="loading">Loading insights...</div>
    </div>
  </div>

  <!-- Sessions Panel -->
  <div class="panel" id="panel-sessions">
    <div id="sessionsContent">
      <div class="loading">Loading sessions...</div>
    </div>
  </div>

  <!-- Search Panel -->
  <div class="panel" id="panel-search">
    <div class="search-bar">
      <input type="text" id="searchQuery" placeholder="Search session messages..." onkeypress="if(event.key==='Enter')doSearch()">
      <button onclick="doSearch()">Search</button>
    </div>
    <div id="searchResults"></div>
  </div>

  <!-- Chat Panel -->
  <div class="panel" id="panel-chat">
    <div class="chat-container">
      <div class="chat-messages" id="chatMessages">
        <div class="empty">Send a message to start chatting with Kyourai.</div>
      </div>
      <div class="chat-input">
        <input type="text" id="chatInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter')sendChat()">
        <button id="chatSend" onclick="sendChat()">Send</button>
      </div>
    </div>
  </div>

</div>

<script>
const API_BASE = window.location.origin + '/v1';
let chatHistory = [];

// -- Tab switching --
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
  });
});

// -- Health check --
async function checkHealth() {
  try {
    const resp = await fetch(API_BASE.replace('/v1', '/health'));
    if (resp.ok) {
      document.getElementById('statusDot').classList.remove('offline');
      document.getElementById('statusText').textContent = 'Connected';
    }
  } catch (e) {
    document.getElementById('statusDot').classList.add('offline');
    document.getElementById('statusText').textContent = 'Offline';
  }
}

// -- Insights --
async function loadInsights() {
  const days = document.getElementById('insightsDays').value || 30;
  const el = document.getElementById('insightsContent');
  el.innerHTML = '<div class="loading">Loading...</div>';

  try {
    const resp = await fetch(`${API_BASE}/insights?days=${days}`);
    const data = await resp.json();

    if (data.empty) {
      el.innerHTML = '<div class="empty">No session data for the selected period.</div>';
      return;
    }

    const ov = data.overview || {};
    let html = '<div class="card-grid">';
    html += card('Sessions', ov.total_sessions || 0, 'blue');
    html += card('Active', ov.active_sessions || 0, 'green');
    html += card('Messages', ov.total_messages || 0, 'blue');
    html += card('Tool Calls', ov.total_tool_calls || 0, 'purple');
    html += card('Facts Stored', ov.total_facts || 0, 'purple');
    html += card('Avg Msgs/Session', ov.avg_messages_per_session || 0, 'blue');
    html += '</div>';

    // Models
    if (data.models && data.models.length) {
      html += '<h3 style="margin-bottom:12px;color:var(--text-dim);font-size:14px;">Models</h3>';
      html += '<table><thead><tr><th>Model</th><th>Sessions</th><th>Messages</th><th>Tool Calls</th></tr></thead><tbody>';
      data.models.forEach(m => {
        html += `<tr><td>${m.model}</td><td>${m.sessions}</td><td>${m.messages}</td><td>${m.tool_calls}</td></tr>`;
      });
      html += '</tbody></table>';
    }

    // Tools
    if (data.tools && data.tools.length) {
      html += '<h3 style="margin-bottom:12px;color:var(--text-dim);font-size:14px;">Tool Usage</h3>';
      html += '<table><thead><tr><th>Tool</th><th>Calls</th></tr></thead><tbody>';
      data.tools.forEach(t => {
        html += `<tr><td>${t.tool_name}</td><td>${t.call_count}</td></tr>`;
      });
      html += '</tbody></table>';
    }

    // Activity
    if (data.activity && data.activity.by_day && data.activity.by_day.length) {
      const days = data.activity.by_day.slice(-14);
      const maxVal = Math.max(...days.map(d => d[1]), 1);
      html += '<h3 style="margin-bottom:12px;color:var(--text-dim);font-size:14px;">Activity (Last 14 Days)</h3>';
      html += '<div class="activity-bar">';
      days.forEach(d => {
        const h = (d[1] / maxVal) * 100;
        html += `<div class="bar" style="height:${h}%" title="${d[0]}: ${d[1]} msgs"></div>`;
      });
      html += '</div>';
      html += '<div class="activity-labels">';
      days.forEach((d, i) => {
        if (i % 2 === 0) html += `<span>${d[0].slice(5)}</span>`;
        else html += '<span></span>';
      });
      html += '</div>';
    }

    el.innerHTML = html;
  } catch (e) {
    el.innerHTML = `<div class="empty">Failed to load insights: ${e.message}</div>`;
  }
}

function card(label, value, color) {
  return `<div class="card"><div class="label">${label}</div><div class="value ${color}">${value}</div></div>`;
}

// -- Sessions --
async function loadSessions() {
  const el = document.getElementById('sessionsContent');
  el.innerHTML = '<div class="loading">Loading...</div>';

  try {
    const resp = await fetch(`${API_BASE}/sessions?limit=50`);
    const data = await resp.json();

    if (!data.data || !data.data.length) {
      el.innerHTML = '<div class="empty">No sessions found.</div>';
      return;
    }

    let html = '<table><thead><tr><th>ID</th><th>Source</th><th>Model</th><th>Messages</th><th>Tools</th><th>Started</th></tr></thead><tbody>';
    data.data.forEach(s => {
      const date = s.started_at ? new Date(s.started_at * 1000).toLocaleString() : '';
      html += `<tr style="cursor:pointer" onclick="showSession('${s.id}')">
        <td>${(s.title || s.id).substring(0, 30)}</td>
        <td>${s.source}</td>
        <td>${(s.model || '').substring(0, 25)}</td>
        <td>${s.message_count}</td>
        <td>${s.tool_call_count}</td>
        <td>${date}</td>
      </tr>`;
    });
    html += '</tbody></table>';
    el.innerHTML = html;
  } catch (e) {
    el.innerHTML = `<div class="empty">Failed to load sessions: ${e.message}</div>`;
  }
}

async function showSession(id) {
  const el = document.getElementById('sessionsContent');
  el.innerHTML = '<div class="loading">Loading session...</div>';

  try {
    const resp = await fetch(`${API_BASE}/sessions/${id}`);
    const data = await resp.json();

    let html = `<div style="margin-bottom:16px"><strong>${data.session.title || data.session.id}</strong></div>`;
    html += '<div class="chat-messages" style="max-height:600px">';

    (data.messages || []).forEach(m => {
      if (!m.content) return;
      const role = m.role;
      const bubbleClass = role === 'user' ? 'user' : 'assistant';
      html += `<div class="msg ${bubbleClass}"><div class="role">${role}</div><div class="bubble">${escapeHtml(m.content.substring(0, 500))}</div></div>`;
    });

    html += '</div>';
    html += `<button onclick="loadSessions()" style="margin-top:12px;padding:8px 16px;background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text);cursor:pointer;">← Back to list</button>`;
    el.innerHTML = html;
  } catch (e) {
    el.innerHTML = `<div class="empty">Failed to load session: ${e.message}</div>`;
  }
}

// -- Search --
async function doSearch() {
  const query = document.getElementById('searchQuery').value.trim();
  const el = document.getElementById('searchResults');
  if (!query) return;

  el.innerHTML = '<div class="loading">Searching...</div>';

  try {
    const resp = await fetch(`${API_BASE}/sessions/search?q=${encodeURIComponent(query)}&limit=20`);
    const data = await resp.json();

    if (!data.results || !data.results.length) {
      el.innerHTML = '<div class="empty">No results found.</div>';
      return;
    }

    let html = `<div style="margin-bottom:16px;color:var(--text-dim)">${data.count} result(s) for "${query}"</div>`;
    data.results.forEach(r => {
      const date = r.timestamp ? new Date(r.timestamp * 1000).toLocaleString() : '';
      html += `<div class="card" style="margin-bottom:8px;cursor:pointer" onclick="showSession('${r.session_id}')">
        <div><strong>[${r.role}]</strong> <span style="color:var(--text-dim)">${r.title || r.session_id.substring(0,20)}</span> — ${date}</div>
        <div class="snippet">${r.snippet || (r.content || '').substring(0, 150)}</div>
      </div>`;
    });
    el.innerHTML = html;
  } catch (e) {
    el.innerHTML = `<div class="empty">Search failed: ${e.message}</div>`;
  }
}

// -- Chat --
async function sendChat() {
  const input = document.getElementById('chatInput');
  const btn = document.getElementById('chatSend');
  const msg = input.value.trim();
  if (!msg) return;

  input.value = '';
  btn.disabled = true;
  btn.textContent = 'Sending...';

  addMessage('user', msg);

  try {
    const resp = await fetch(`${API_BASE}/chat/completions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'kyourai',
        messages: [...chatHistory, { role: 'user', content: msg }],
        stream: false,
      }),
    });

    const data = await resp.json();
    const reply = data.choices?.[0]?.message?.content || '(empty response)';
    addMessage('assistant', reply);
    chatHistory.push({ role: 'user', content: msg });
    chatHistory.push({ role: 'assistant', content: reply });
  } catch (e) {
    addMessage('assistant', `Error: ${e.message}`);
  }

  btn.disabled = false;
  btn.textContent = 'Send';
}

function addMessage(role, content) {
  const container = document.getElementById('chatMessages');
  if (container.querySelector('.empty')) container.innerHTML = '';

  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `<div class="role">${role}</div><div class="bubble">${escapeHtml(content)}</div>`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// -- Init --
checkHealth();
loadInsights();
loadSessions();
</script>
</body>
</html>
